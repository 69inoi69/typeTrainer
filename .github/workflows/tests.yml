# Checks every pull request before it is merged (pages.yml checks main again
# before publishing): formatting, static checks, tests (the storage tests
# also against a real PostgreSQL), and that the WebAssembly version of the
# site still compiles.
name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # a throwaway PostgreSQL for internal/storage/postgres_test.go
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tt
          POSTGRES_PASSWORD: tt
          POSTGRES_DB: typetrainer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TT_TEST_DATABASE_URL: postgres://tt:tt@localhost:5432/typetrainer_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Run gofmt -w . on these files:"; gofmt -l .; exit 1
          fi

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: WebAssembly build
        run: GOOS=js GOARCH=wasm go build -o /dev/null .
