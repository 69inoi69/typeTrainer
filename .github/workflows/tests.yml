# Checks every pull request before it is merged (pages.yml checks main again
# before publishing): formatting, static checks, tests, and that the
# WebAssembly version of the site still compiles.
name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Run gofmt -w . on these files:"; gofmt -l .; exit 1
          fi

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: WebAssembly build
        run: GOOS=js GOARCH=wasm go build -o /dev/null .
